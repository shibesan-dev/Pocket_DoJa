# GUNDAM U.C.0079 (P906i version)
#
# The game requests a landscape display but remaps its own d-pad as if the
# handset pad rotated with the screen: pressing Up reaches the game as Left,
# Left as Down, Down as Right and Right as Up. OpenDoJa's controls follow the
# displayed picture, so rotate the direction keys one step clockwise at the
# input boundary to undo the game's counter-clockwise remap.
reason=Landscape title remaps the d-pad counter-clockwise relative to the displayed picture.

# Kingdom Hearts coded - Side Episode
#
# The game asks for a sideways display and remaps its own d-pad to match a
# handset held rotated. OpenDoJa's controls stay aligned with the picture, so
# rotate the direction keys back at the input boundary.
#
# The warning screen draws only text and expects a blank back buffer after a
# flush; without that the previous screen shows through. Clearing every frame
# would wipe the title menu's background, so only text-only frames are cleared.
#
# Text keeps the native bitmap advances. Dialogs and fixed-width bars assume
# the 12-30 dot metrics, so bold is used to keep thin letters readable without
# widening them.
reason=Sideways display style rotates the game's own d-pad mapping; its warning screen expects a blank back buffer, while the title menu relies on frame persistence.
match.1.fingerprints=key:main/kh;apid:03000007185
override.input.rotateDpadForSidewaysKeyStyle=true
override.font.pixelBold=true
override.graphics.clearCanvasAfterFlush=true

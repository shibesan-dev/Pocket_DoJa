plugins {
    id 'com.android.application'
}

def signingPropsPath = project.findProperty('pocketdoja.signingProps') ?: 'C:/AndroidPrivate/PocketDoJa/signing.properties'
def signingPropsFile = file(signingPropsPath)
def hasSigning = signingPropsFile.exists()

android {
    namespace 'opendoja.android'
    compileSdk 34

    // External signing configuration (never committed).
    signingConfigs {
        debug {
            // default debug keystore
        }
        release {
            if (hasSigning) {
                def props = new Properties()
                signingPropsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.shibesan.pocketdoja'
        minSdk 24
        // 30 keeps java.nio.charset.Charset->defaultCharset (max-target-r) visible to
        // reflection so installDefaultCharsetOverride() can fix new String(byte[]) mojibake.
        targetSdk 30
        versionCode 4
        versionName '1.3.0a'
        manifestPlaceholders = [appLabel: "Pocket DoJa"]
    }

    lint {
        // The shared source root contains dev-only folders that are excluded
        // from the APK but still scanned by lint; lint.xml keeps their JDK API
        // usage out of the shipped-app report.
        lintConfig = file("${rootDir}/lint.xml")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        debug {
            // Install the debug build alongside the signed release. The
            // release keeps applicationId com.shibesan.pocketdoja, so users
            // still get normal updates; only debug gets its own package/data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appLabel: "Pocket DoJa Debug"]
            debuggable true
        }
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            debuggable false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs = ["${rootDir}/opendoja/src/main/java", "${projectDir}/src/main/java"]
                exclude 'opendoja/launcher/**'
                exclude 'opendoja/probes/**'
                exclude 'opendoja/tools/**'
                exclude 'opendoja/host/input/ControllerInputManagerProbe.java'
            }
            resources {
                srcDirs = ["${rootDir}/opendoja/src/main/resources"]
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !hasSigning) {
        throw new GradleException("Release signing configuration not found at: ${signingPropsFile}. Create signing.properties (storeFile, storePassword, keyAlias, keyPassword) outside the project.")
    }
}

dependencies {
    // The _nio variant backports java.nio.file (Path/Paths/Files) to API 24,
    // so the emulator's host file layer works on Android 7.0/7.1 as well.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'
    implementation project(':dexlib')
    implementation 'com.android.tools:r8:8.5.35'
    implementation 'org.ow2.asm:asm:9.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "PocketDoJa-v${variant.versionName}.apk"
    }
}

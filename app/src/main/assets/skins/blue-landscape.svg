<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%" viewBox="0 0 800 400"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title desc">
  <title id="title">Pocket DoJa Transparent Blue Landscape Skin</title>
  <desc id="desc">Scalable translucent blue feature-phone frame. The left game viewport and right control area are transparent.</desc>
  <metadata>
    Pocket DoJa vector skin.
    ViewBox: 800 x 400.
    Game viewport: x=48, y=42, width=422, height=316.
    Viewport aspect ratio: 4:3.
    Control reservation: x=510, y=26, width=264, height=348.
    The viewport and control reservation are intentionally transparent.
    Scale uniformly; preserve the viewBox aspect ratio.
  </metadata>

  <defs>
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1f7ff" stop-opacity=".94"/>
      <stop offset=".14" stop-color="#36b9f2" stop-opacity=".84"/>
      <stop offset=".32" stop-color="#0876c9" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#75d8ff" stop-opacity=".78"/>
      <stop offset=".72" stop-color="#0759a8" stop-opacity=".94"/>
      <stop offset=".88" stop-color="#38b8ed" stop-opacity=".84"/>
      <stop offset="1" stop-color="#063d7c" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="faceMetal" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#c8f1ff" stop-opacity=".62"/>
      <stop offset=".2" stop-color="#55c9fa" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#0875c5" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#8ce4ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#034b91" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="screenRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#063d78"/>
      <stop offset=".18" stop-color="#d8f8ff"/>
      <stop offset=".52" stop-color="#168bd3"/>
      <stop offset=".82" stop-color="#a7eaff"/>
      <stop offset="1" stop-color="#04366c"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".3" stop-color="#d9f8ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#003c78" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="brushed" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 .5H5" stroke="#e5fbff" stroke-opacity=".22" stroke-width=".6"/>
      <path d="M0 3H5" stroke="#003e78" stroke-opacity=".16" stroke-width=".55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="10" y="10" width="780" height="380" rx="43"/>
    </clipPath>
  </defs>

  <rect x="17" y="18" width="766" height="372" rx="44" fill="#001d38" opacity=".28" filter="url(#shadow)"/>

  <!-- Main shell with a real transparent game-screen aperture. -->
  <path fill="url(#bodyMetal)" fill-rule="evenodd"
        d="M53 10 H747 Q790 10 790 53 V347 Q790 390 747 390 H53 Q10 390 10 347 V53 Q10 10 53 10 Z
           M61 42 H457 Q470 42 470 55 V345 Q470 358 457 358 H61 Q48 358 48 345 V55 Q48 42 61 42 Z"/>
  <g clip-path="url(#bodyClip)">
    <rect x="10" y="10" width="780" height="380" rx="43" fill="url(#brushed)" opacity=".7"/>
    <rect x="14" y="14" width="772" height="372" rx="39" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="2"/>
    <rect x="20" y="20" width="760" height="360" rx="34" fill="none" stroke="#56616c" stroke-opacity=".48" stroke-width="1.5"/>
    <rect x="12" y="12" width="776" height="376" rx="42" fill="url(#panelSheen)"/>
    <path d="M26 64 Q26 28 62 28 H738" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  </g>

  <!-- Game-screen bezel. The interior remains transparent. -->
  <rect x="40" y="34" width="438" height="332" rx="19" fill="none" stroke="#59636e" stroke-width="7"/>
  <rect x="43" y="37" width="432" height="326" rx="16" fill="none" stroke="url(#screenRim)" stroke-width="5"/>
  <rect x="48" y="42" width="422" height="316" rx="11" fill="none" stroke="#f9fbfc" stroke-opacity=".9" stroke-width="1.5"/>
  <path d="M56 50 H462" stroke="#fff" stroke-opacity=".52" stroke-width="1.2"/>

  <!-- Top/side speaker detail, outside the viewport. -->
  <rect x="548" y="42" width="112" height="13" rx="6.5" fill="#56616a"/>
  <rect x="552" y="44" width="104" height="8" rx="4" fill="#20272d"/>
  <path d="M560 46 H648" stroke="#aeb9c3" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="704" cy="49" r="7" fill="#68737d" stroke="#f8fafb" stroke-width="2"/>
  <circle cx="704" cy="49" r="3" fill="#596d7b"/>

  <!-- Right-side control reservation: intentionally blank for existing emulator controls. -->
  <path d="M516 78 Q516 66 528 66 H756 Q768 66 768 78 V342 Q768 354 756 354 H528 Q516 354 516 342 Z"
        fill="url(#faceMetal)" opacity=".82"/>
  <path d="M520 80 Q520 70 530 70 H754 Q764 70 764 80"
        fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  <path d="M520 340 Q520 350 530 350 H754 Q764 350 764 340"
        fill="none" stroke="#68727c" stroke-opacity=".4" stroke-width="1.5"/>

  <!-- Non-interactive construction details. -->
  <circle cx="28" cy="28" r="2.2" fill="#707a84"/>
  <circle cx="772" cy="28" r="2.2" fill="#707a84"/>
  <circle cx="28" cy="372" r="2.2" fill="#707a84"/>
  <circle cx="772" cy="372" r="2.2" fill="#707a84"/>
  <path d="M496 22 V378" stroke="#fff" stroke-opacity=".22" stroke-width="1"/>
</svg>

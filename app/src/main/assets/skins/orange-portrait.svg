<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Pocket DoJa Transparent Blue Portrait Skin</title>
  <desc id="desc" fill="#000000">Scalable translucent blue feature-phone frame. The central game viewport and lower control area are transparent.</desc>
  <metadata fill="#000000">
    Pocket DoJa vector skin.
    ViewBox: 400 x 800.
    Game viewport: x=42, y=112, width=316, height=422.
    Viewport aspect ratio: 3:4.
    Control reservation: x=24, y=568, width=352, height=208.
    The viewport and control reservation are intentionally transparent.
    Scale uniformly; preserve the viewBox aspect ratio.
  </metadata>

  <defs fill="#000000">
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="1" fill="#000000">
      <stop offset="0" stop-color="#fff1e1" stop-opacity=".94" fill="#000000"/>
      <stop offset=".14" stop-color="#f29536" stop-opacity=".84" fill="#000000"/>
      <stop offset=".32" stop-color="#c97708" stop-opacity=".92" fill="#000000"/>
      <stop offset=".52" stop-color="#ffad75" stop-opacity=".78" fill="#000000"/>
      <stop offset=".72" stop-color="#a84807" stop-opacity=".94" fill="#000000"/>
      <stop offset=".88" stop-color="#eda038" stop-opacity=".84" fill="#000000"/>
      <stop offset="1" stop-color="#7c4606" stop-opacity=".96" fill="#000000"/>
    </linearGradient>
    <linearGradient id="faceMetal" x1="0" y1="0" x2=".9" y2="1" fill="#000000">
      <stop offset="0" stop-color="#ffe4c8" stop-opacity=".62" fill="#000000"/>
      <stop offset=".2" stop-color="#faa355" stop-opacity=".34" fill="#000000"/>
      <stop offset=".48" stop-color="#c56e08" stop-opacity=".55" fill="#000000"/>
      <stop offset=".72" stop-color="#ffbe8c" stop-opacity=".35" fill="#000000"/>
      <stop offset="1" stop-color="#913803" stop-opacity=".72" fill="#000000"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" fill="#000000">
      <stop offset="0" stop-color="#746860" fill="#000000"/>
      <stop offset=".12" stop-color="#ffffff" fill="#000000"/>
      <stop offset=".5" stop-color="#a49b92" fill="#000000"/>
      <stop offset=".86" stop-color="#ffffff" fill="#000000"/>
      <stop offset="1" stop-color="#756c62" fill="#000000"/>
    </linearGradient>
    <linearGradient id="screenRim" x1="0" y1="0" x2="0" y2="1" fill="#000000">
      <stop offset="0" stop-color="#784706" fill="#000000"/>
      <stop offset=".18" stop-color="#ffedd8" fill="#000000"/>
      <stop offset=".52" stop-color="#d36f16" fill="#000000"/>
      <stop offset=".82" stop-color="#ffd9a7" fill="#000000"/>
      <stop offset="1" stop-color="#6c2e04" fill="#000000"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="0" y2="1" fill="#000000">
      <stop offset="0" stop-color="#fff" stop-opacity=".62" fill="#000000"/>
      <stop offset=".3" stop-color="#ffebd9" stop-opacity=".12" fill="#000000"/>
      <stop offset="1" stop-color="#784d00" stop-opacity=".16" fill="#000000"/>
    </linearGradient>
    <pattern id="brushed" width="5" height="5" patternUnits="userSpaceOnUse" fill="#000000">
      <path d="M0 .5H5" stroke="#fff4e5" stroke-opacity=".22" stroke-width=".6" fill="#000000"/>
      <path d="M0 3H5" stroke="#783900" stroke-opacity=".16" stroke-width=".55" fill="#000000"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" fill="#000000">
      <feGaussianBlur stdDeviation="5" fill="#000000"/>
    </filter>
    <clipPath id="bodyClip" fill="#000000">
      <rect x="10" y="10" width="380" height="780" rx="43" fill="#000000"/>
    </clipPath>
  </defs>

  <!-- Soft grounding shadow, kept inside the SVG canvas. -->
  <rect x="17" y="18" width="366" height="772" rx="44" fill="#381700" opacity=".28" filter="url(#shadow)"/>

  <!-- Main phone shell with a genuinely transparent screen aperture. -->
  <path fill="url(#bodyMetal)" fill-rule="evenodd" d="M53 10 H347 Q390 10 390 53 V747 Q390 790 347 790 H53 Q10 790 10 747 V53 Q10 10 53 10 Z            M55 112 H345 Q358 112 358 125 V521 Q358 534 345 534 H55 Q42 534 42 521 V125 Q42 112 55 112 Z"/>
  <g clip-path="url(#bodyClip)">
    <rect x="10" y="10" width="380" height="780" rx="43" fill="url(#brushed)" opacity=".7"/>
    <rect x="14" y="14" width="372" height="772" rx="39" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="2"/>
    <rect x="20" y="20" width="360" height="760" rx="34" fill="none" stroke="#6c5e56" stroke-opacity=".48" stroke-width="1.5"/>
    <path d="M24 64 Q24 28 60 28 H340" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
    <path d="M20 700 V742 Q20 780 58 780 H342" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
    <rect x="12" y="12" width="376" height="776" rx="42" fill="url(#panelSheen)"/>
  </g>

  <!-- Screen bezel: all strokes surround the opening; no fill is placed inside it. -->
  <rect x="34" y="104" width="332" height="438" rx="19" fill="none" stroke="#6e6459" stroke-width="7"/>
  <rect x="37" y="107" width="326" height="432" rx="16" fill="none" stroke="url(#screenRim)" stroke-width="5"/>
  <rect x="42" y="112" width="316" height="422" rx="11" fill="none" stroke="#f9fbfc" stroke-opacity=".9" stroke-width="1.5"/>
  <path d="M50 120 H350" stroke="#fff" stroke-opacity=".52" stroke-width="1.2" fill="#000000"/>

  <!-- Top earpiece and small status lens. -->
  <rect x="145" y="48" width="110" height="15" rx="7.5" fill="#6a6156"/>
  <rect x="149" y="50" width="102" height="10" rx="5" fill="#2d2620"/>
  <path d="M156 52 H244" stroke="#c3b6ae" stroke-opacity=".55" stroke-width="1" fill="#000000"/>
  <circle cx="292" cy="55" r="7" fill="#7d7368" stroke="#f8fafb" stroke-width="2"/>
  <circle cx="292" cy="55" r="3" fill="#7b6759"/>

  <!-- Lower control reservation: intentionally blank for the emulator's own controls. -->
  <path d="M28 568 Q28 558 40 558 H360 Q372 558 372 570 V748 Q372 772 348 772 H52 Q28 772 28 748 Z" fill="url(#faceMetal)" opacity=".82"/>
  <path d="M31 570 Q31 562 42 562 H358 Q369 562 369 573" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  <path d="M31 750 Q31 768 52 768 H348 Q369 768 369 750" fill="none" stroke="#7c6c68" stroke-opacity=".4" stroke-width="1.5"/>

  <!-- Small non-interactive construction details. -->
  <circle cx="27" cy="91" r="2.2" fill="#847970"/>
  <circle cx="373" cy="91" r="2.2" fill="#847970"/>
  <circle cx="27" cy="710" r="2.2" fill="#847970"/>
  <circle cx="373" cy="710" r="2.2" fill="#847970"/>
  <path d="M18 180 V620 M382 180 V620" stroke="#fff" stroke-opacity=".22" stroke-width="1" fill="#000000"/>
</svg>